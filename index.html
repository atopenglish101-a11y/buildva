<script>


const firebaseConfig = {

};





firebase.initializeApp(firebaseConfig);




const db=firebase.database();






let TOTAL_NUMBERS=200;


let gameCode=null;


let gameRef=null;


let playerNumber=null;


let currentGame=null;


let gameStarted=false;








function shuffle(array){



for(let i=array.length-1;i>0;i--){



let j=Math.floor(Math.random()*(i+1));



[array[i],array[j]]=[array[j],array[i]];



}



return array;



}










function generateGameCode(){



let chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";



let code="";



for(let i=0;i<6;i++){



code+=chars[Math.floor(Math.random()*chars.length)];



}



return code;



}










async function createGame(){



let size=document.querySelector(

'input[name="gameSize"]:checked'

).value;





TOTAL_NUMBERS=Number(size);





gameCode=generateGameCode();





gameRef=db.ref("games/"+gameCode);





let board=[];



for(let i=1;i<=TOTAL_NUMBERS;i++){



board.push(i);



}



shuffle(board);







await gameRef.set({



maxNumber:TOTAL_NUMBERS,


board:board,


target:1,


score1:0,


score2:0,


finished:false,


started:false,


winner:null,


countdown:false,



players:{


player1:false,


player2:false


}



});





openGame();



}









async function joinGame(){



let code=document

.getElementById("gameCodeInput")

.value

.trim()

.toUpperCase();






if(!code)return;





gameCode=code;





gameRef=db.ref("games/"+gameCode);






let snap=await gameRef.once("value");





if(!snap.exists()){



document.getElementById("status").innerHTML=

"❌ Game not found";



return;



}





openGame();



}









function openGame(){



document.getElementById("setup").style.display="none";


document.getElementById("playerArea").style.display="block";






// Restore player AND game identity


let savedGame=

localStorage.getItem("buildvaGameCode");


let savedPlayer=

localStorage.getItem("buildvaPlayerNumber");





if(savedGame===gameCode && savedPlayer){


playerNumber=Number(savedPlayer);


}







document.getElementById("code").innerHTML=

"Game Code: "+gameCode;





listenGame();
watchForVoiceEnd();



}









function listenGame(){



gameRef.on("value",snap=>{



currentGame=snap.val();





if(currentGame){



if(currentGame.maxNumber){


TOTAL_NUMBERS=currentGame.maxNumber;


}



updateScreen();



}



});





}









async function choosePlayer(number){



let name=document

.getElementById("playerName")

.value

.trim();






if(!name){



alert("Please enter your name");



return;



}







playerNumber=number;






// Save BOTH game and player


localStorage.setItem(

"buildvaGameCode",

gameCode

);



localStorage.setItem(

"buildvaPlayerNumber",

number

);







let path="players/player"+number;






await gameRef.child(path).set({



name:name,


ready:true



});





}

function startCountdown(){


if(currentGame.started)return;


gameStarted=true;


let count=3;



document.getElementById("countdown").innerHTML=count;




let timer=setInterval(()=>{


count--;



if(count>0){


document.getElementById("countdown").innerHTML=count;


}

else{


clearInterval(timer);



document.getElementById("countdown").innerHTML="🚀 GO!";



gameRef.update({

started:true

});



setTimeout(()=>{


document.getElementById("countdown").innerHTML="";


},1000);



}



},1000);



}










function updateScreen(){



document.getElementById("score1").innerHTML=

currentGame.score1 || 0;



document.getElementById("score2").innerHTML=

currentGame.score2 || 0;





if(currentGame.players.player1){


document.getElementById("name1").innerHTML=

"👤 "+currentGame.players.player1.name;


}



if(currentGame.players.player2){


document.getElementById("name2").innerHTML=

"👤 "+currentGame.players.player2.name;


}







document.getElementById("target").innerHTML=

currentGame.target;





document.getElementById("remaining").innerHTML=

Math.max(

0,

TOTAL_NUMBERS-currentGame.target+1

);









if(

currentGame.players.player1 &&

currentGame.players.player2

){



document.getElementById("gameArea").style.display="block";



document.getElementById("waiting").innerHTML="";







if(!currentGame.started && !currentGame.countdown){



gameRef.update({

countdown:true

});



startCountdown();



}




renderBoard();



}

else{


document.getElementById("waiting").innerHTML=

"Waiting for another player...";


}






if(currentGame.finished){


showWinner();


}



}









function renderBoard(){



let box=document.getElementById("numbers");



box.innerHTML="";






currentGame.board.forEach(num=>{



let button=document.createElement("button");



button.className="number";


button.innerHTML=num;





if(num < currentGame.target){


button.classList.add("used");


}






else if(!currentGame.started || currentGame.finished){


button.disabled=true;


}





else{


button.onclick=function(){


pickNumber(num);


};



}





box.appendChild(button);



});



}









async function pickNumber(num){



// IMPORTANT FIX

if(!playerNumber){


let savedPlayer=

localStorage.getItem("buildvaPlayerNumber");


if(savedPlayer){


playerNumber=Number(savedPlayer);


}

}





if(!playerNumber)return;






await gameRef.transaction(game=>{



if(!game)return game;



if(!game.started)return game;



if(game.finished)return game;






if(num !== game.target){


return game;


}







if(playerNumber===1){


game.score1++;


}

else{


game.score2++;


}






if(game.target===TOTAL_NUMBERS){



game.finished=true;






if(game.score1>game.score2){


game.winner=1;


}

else if(game.score2>game.score1){


game.winner=2;


}

else{


game.winner=0;


}





}

else{


game.target++;


}





return game;



});



}









function showWinner(){



let text="";






if(currentGame.winner===1){



text="🏆 "+

currentGame.players.player1.name+

" Wins!";



}



else if(currentGame.winner===2){



text="🏆 "+

currentGame.players.player2.name+

" Wins!";



}



else{


text="🤝 Draw Game!";


}






document.getElementById("popupText").innerHTML=

text+

"<br><br>"+

"Score: "+

currentGame.score1+

" - "+

currentGame.score2;






document.getElementById("winnerPopup").style.display="block";



}

board.push(i);

/* =========================================================
   VOICE CHAT
   WebRTC + Firebase signaling
   This section does NOT replace any game functions.
========================================================= */

let localStream = null;
let peerConnection = null;
let remoteAudio = null;
let voiceListeners = [];
let voiceStarted = false;
let pendingRemoteCandidates = [];
let remoteDescriptionReady = false;

const voiceConfig = {
  iceServers: [
    { urls:"stun:stun.l.google.com:19302" },
    { urls:"stun:stun1.l.google.com:19302" }
  ]
};

function setVoiceStatus(message){
  const status=document.getElementById("voiceStatus");
  if(status) status.innerHTML=message;
}

function setVoiceButtons(active){
  const start=document.getElementById("voiceStartBtn");
  const mute=document.getElementById("voiceMuteBtn");
  const end=document.getElementById("voiceEndBtn");

  if(start) start.style.display=active ? "none" : "inline-block";
  if(mute) mute.style.display=active ? "inline-block" : "none";
  if(end) end.style.display=active ? "inline-block" : "none";

  if(mute && !active) mute.innerHTML="🔇 Mute";
}

function createRemoteAudio(){
  if(remoteAudio) return;

  remoteAudio=document.createElement("audio");
  remoteAudio.id="remoteAudio";
  remoteAudio.autoplay=true;
  remoteAudio.playsInline=true;
  remoteAudio.style.display="none";
  document.body.appendChild(remoteAudio);
}

function removeVoiceListeners(){
  voiceListeners.forEach(item=>{
    try{
      item.ref.off(item.event,item.callback);
    }catch(error){}
  });
  voiceListeners=[];
}

async function flushRemoteCandidates(){
  if(!peerConnection || !remoteDescriptionReady) return;

  const candidates=[...pendingRemoteCandidates];
  pendingRemoteCandidates=[];

  for(const candidate of candidates){
    try{
      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    }catch(error){
      console.error("ICE candidate error:",error);
    }
  }
}

function listenForRemoteCandidates(){
  if(!gameRef || !playerNumber) return;

  const otherPlayer=playerNumber===1 ? 2 : 1;
  const candidateRef=gameRef.child(
    "voice/candidates/player"+otherPlayer
  );

  const callback=async snapshot=>{
    const candidate=snapshot.val();
    if(!candidate || !peerConnection) return;

    if(!remoteDescriptionReady){
      pendingRemoteCandidates.push(candidate);
      return;
    }

    try{
      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    }catch(error){
      console.error("ICE candidate error:",error);
    }
  };

  candidateRef.on("child_added",callback);

  voiceListeners.push({
    ref:candidateRef,
    event:"child_added",
    callback:callback
  });
}

function setupVoiceConnection(){
  peerConnection=new RTCPeerConnection(voiceConfig);

  localStream.getTracks().forEach(track=>{
    peerConnection.addTrack(track,localStream);
  });

  peerConnection.ontrack=event=>{
    createRemoteAudio();

    if(event.streams && event.streams[0]){
      remoteAudio.srcObject=event.streams[0];
      remoteAudio.play().catch(()=>{});
    }

    setVoiceStatus("🟢 Voice connected");
  };

  peerConnection.onicecandidate=async event=>{
    if(!event.candidate || !gameRef || !playerNumber) return;

    try{
      await gameRef
        .child("voice/candidates/player"+playerNumber)
        .push(event.candidate.toJSON());
    }catch(error){
      console.error("Could not send ICE candidate:",error);
    }
  };

  peerConnection.onconnectionstatechange=()=>{
    if(!peerConnection) return;

    const state=peerConnection.connectionState;

    if(state==="connected"){
      setVoiceStatus("🟢 Voice connected");
    }else if(state==="connecting"){
      setVoiceStatus("🟡 Connecting voice...");
    }else if(state==="disconnected"){
      setVoiceStatus("🟠 Voice disconnected");
    }else if(state==="failed"){
      setVoiceStatus("🔴 Voice connection failed");
    }
  };
}

async function startVoiceChat(){

  if(!gameRef || !gameCode){
    alert("Please join a game first.");
    return;
  }

  if(!playerNumber){
    alert("Please choose Player 1 or Player 2 first.");
    return;
  }

  if(
    !currentGame ||
    !currentGame.players ||
    !currentGame.players.player1 ||
    !currentGame.players.player2
  ){
    alert("Both players must join the game before starting voice chat.");
    return;
  }

  if(voiceStarted) return;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert(
      "Voice chat needs a secure website (HTTPS or localhost) and a browser with microphone support."
    );
    return;
  }

  try{

    setVoiceStatus("🎙️ Requesting microphone access...");

    localStream=await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    createRemoteAudio();

    pendingRemoteCandidates=[];
    remoteDescriptionReady=false;

    setupVoiceConnection();

    voiceStarted=true;
    setVoiceButtons(true);

    if(playerNumber===1){

      /*
        Player 1 starts a fresh voice call and clears
        old signaling information.
      */
      await gameRef.child("voice").remove();

      const callId=Date.now().toString();

      await gameRef.child("voice/callId").set(callId);

      await gameRef.child("voice/ended").set(false);

      const offer=await peerConnection.createOffer();

      await peerConnection.setLocalDescription(offer);

      await gameRef.child("voice/offer").set({
        type:offer.type,
        sdp:offer.sdp
      });

      setVoiceStatus("🟡 Waiting for Player 2...");

      const answerRef=gameRef.child("voice/answer");

      const answerCallback=async snapshot=>{
        const answer=snapshot.val();

        if(
          !answer ||
          !peerConnection ||
          peerConnection.currentRemoteDescription
        ){
          return;
        }

        try{
          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(answer)
          );

          remoteDescriptionReady=true;
          await flushRemoteCandidates();

          setVoiceStatus("🟡 Connecting voice...");
        }catch(error){
          console.error("Answer error:",error);
          setVoiceStatus("🔴 Voice connection error");
        }
      };

      answerRef.on("value",answerCallback);

      voiceListeners.push({
        ref:answerRef,
        event:"value",
        callback:answerCallback
      });

    }else{

      setVoiceStatus("🟡 Waiting for Player 1...");

      const offerRef=gameRef.child("voice/offer");

      const offerCallback=async snapshot=>{
        const offer=snapshot.val();

        if(
          !offer ||
          !peerConnection ||
          peerConnection.currentRemoteDescription
        ){
          return;
        }

        try{

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(offer)
          );

          remoteDescriptionReady=true;
          await flushRemoteCandidates();

          const answer=await peerConnection.createAnswer();

          await peerConnection.setLocalDescription(answer);

          await gameRef.child("voice/answer").set({
            type:answer.type,
            sdp:answer.sdp
          });

          setVoiceStatus("🟡 Connecting voice...");

        }catch(error){
          console.error("Offer error:",error);
          setVoiceStatus("🔴 Voice connection error");
        }
      };

      offerRef.on("value",offerCallback);

      voiceListeners.push({
        ref:offerRef,
        event:"value",
        callback:offerCallback
      });
    }

    listenForRemoteCandidates();

  }catch(error){

    console.error("Voice chat error:",error);

    voiceStarted=false;
    setVoiceButtons(false);

    if(localStream){
      localStream.getTracks().forEach(track=>track.stop());
      localStream=null;
    }

    if(peerConnection){
      try{
        peerConnection.close();
      }catch(error){}
      peerConnection=null;
    }

    setVoiceStatus("🔴 Microphone access failed");

    alert(
      "Could not access your microphone. Please allow microphone access in your browser."
    );
  }
}

function toggleMute(){

  if(!localStream) return;

  const audioTracks=localStream.getAudioTracks();
  if(audioTracks.length===0) return;

  const currentlyEnabled=audioTracks[0].enabled;

  audioTracks.forEach(track=>{
    track.enabled=!currentlyEnabled;
  });

  const button=document.getElementById("voiceMuteBtn");

  if(currentlyEnabled){
    button.innerHTML="🔊 Unmute";
    setVoiceStatus("🔇 Microphone muted");
  }else{
    button.innerHTML="🔇 Mute";
    setVoiceStatus("🟢 Voice connected");
  }
}

async function endVoiceChat(){

  removeVoiceListeners();

  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
    localStream=null;
  }

  if(peerConnection){
    try{
      peerConnection.close();
    }catch(error){}
    peerConnection=null;
  }

  pendingRemoteCandidates=[];
  remoteDescriptionReady=false;

  if(remoteAudio){
    remoteAudio.srcObject=null;
    remoteAudio.remove();
    remoteAudio=null;
  }

  /*
    Removing the shared voice node tells the other player
    that the call has ended too.
  */
  if(gameRef){
    try{
      await gameRef.child("voice").remove();
    }catch(error){
      console.error("Could not clear voice data:",error);
    }
  }

  voiceStarted=false;
  setVoiceButtons(false);
  setVoiceStatus("🔴 Voice chat is off");
}

/*
  If the other player ends the voice call,
  Firebase removes the shared voice node.
*/
function watchForVoiceEnd(){

  if(!gameRef) return;

  const voiceRef=gameRef.child("voice");
  let voiceWasPresent=false;

  const callback=snapshot=>{

    if(snapshot.exists()){
      voiceWasPresent=true;
      return;
    }

    if(voiceWasPresent && voiceStarted){

      removeVoiceListeners();

      if(localStream){
        localStream.getTracks().forEach(track=>track.stop());
        localStream=null;
      }

      if(peerConnection){
        try{
          peerConnection.close();
        }catch(error){}
        peerConnection=null;
      }

      pendingRemoteCandidates=[];
      remoteDescriptionReady=false;

      if(remoteAudio){
        remoteAudio.srcObject=null;
        remoteAudio.remove();
        remoteAudio=null;
      }

      voiceStarted=false;
      setVoiceButtons(false);
      setVoiceStatus("🔴 Other player ended voice chat");
    }
  };

  voiceRef.on("value",callback);

  voiceListeners.push({
    ref:voiceRef,
    event:"value",
    callback:callback
  });
}

window.addEventListener("beforeunload",()=>{
  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
  }

  if(peerConnection){
    try{
      peerConnection.close();
    }catch(error){}
  }
});
